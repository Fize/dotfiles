# Standalone tmux configuration for this machine.

# Terminal and input behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:clipboard,xterm-256color:extkeys"
set -g set-clipboard on
set -g allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u
set -s escape-time 0
set -g focus-events on
set -g mouse on

# Sensible defaults
set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g status-keys vi
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind p paste-buffer
set -g set-titles on
set -g set-titles-string '#h - #S:#I #W'

# Keep the familiar C-b prefix and retain C-a as a secondary prefix.
set -g prefix C-b
set -g prefix2 C-a
bind C-b send-prefix
bind C-a send-prefix -2
# Remove the old project binding, which called a helper script from its config.
unbind-key -T prefix m

# New windows and panes start in the current directory.
bind c new-window -c '#{pane_current_path}'
bind-key "-" split-window -v -c '#{pane_current_path}'
bind _ split-window -h -c '#{pane_current_path}'

# Vi-style pane navigation and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Solarized Dark Higher Contrast palette.
set -g pane-border-style 'fg=#586e75'
set -g pane-active-border-style 'fg=#2aa198'
set -g message-style 'fg=#002b36,bg=#b58900,bold'
set -g mode-style 'fg=#002b36,bg=#2aa198,bold'

# Status line, modelled on gpakosz/.tmux: the bar is a row of solid colour
# blocks rather than flat text, so each piece of information reads as its own
# chip. Colours come from the same Solarized palette used above.
#
#   #002b36  bar background (base03)
#   #2aa198  session chip     (cyan)
#   #b58900  current window   (yellow)
#   #073642  last-used window (base02)
#   #657b83  dim text        (base00)
#   #93a1a1  body text       (base1)
#   #dc322f  bell            (red)
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100
set -g status-style 'fg=#93a1a1,bg=#002b36'

# Left: solid cyan chip with the session name. The trailing space is part of the
# chip so the block ends on a clean edge.
set -g status-left '#[fg=#002b36,bg=#2aa198,bold] #{session_name} #[fg=#93a1a1,bg=#002b36]'

# Right: flags first, then host and time, each as its own block. The host and
# date drop out on narrow terminals so the window list keeps its room.
# NOTE: inside #{?cond,a,b} a style such as #[fg=...,bg=...] breaks the branch
# on its commas, so attributes are emitted one #[...] at a time.
set -g status-right '#{?client_prefix,#[fg=#002b36]#[bg=#b58900]#[bold] PREFIX #[fg=#93a1a1]#[bg=#002b36]#[nobold],}#{?window_zoomed_flag,#[fg=#002b36]#[bg=#2aa198]#[bold] ZOOM #[fg=#93a1a1]#[bg=#002b36]#[nobold],}#{?#{e|>=:#{client_width},72},#[fg=#002b36]#[bg=#586e75]#[bold] #{=16:host_short} #[fg=#93a1a1]#[bg=#002b36]#[nobold],}#{?#{e|>=:#{client_width},56},#[fg=#657b83] %m-%d ,}#[fg=#002b36]#[bg=#93a1a1]#[bold] %H:%M #[fg=#93a1a1]#[bg=#002b36]#[nobold]'

# Inactive windows: plain text on the bar background, separated by spaces.
# window_last_flag marks the previously visited window with a base02 block so
# you can see where <prefix>l would take you.
setw -g window-status-separator ' '
setw -g window-status-format '#[none]#{?window_last_flag,#[fg=#93a1a1]#[bg=#073642],#[fg=#657b83]#[bg=#002b36]}#{?window_activity_flag,#[underscore],}#{?window_bell_flag,#[fg=#dc322f]#[bold],#[nobold]} #{window_index} #{window_name}#{?window_bell_flag, !,} '

# Current window: solid yellow chip with dark text, like the session chip.
setw -g window-status-current-format '#[none]#[fg=#002b36]#[bg=#b58900]#[bold] #{window_index} #{window_name}#{?window_zoomed_flag, +,} '

# These are kept for consistency, but the format above renders activity and
# bell itself (an explicit #[fg=...] overrides these styles).
setw -g window-status-activity-style 'fg=#2aa198,underscore'
setw -g window-status-bell-style 'fg=#dc322f,bold'
