# Standalone tmux configuration for this machine.

# Terminal and input behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:clipboard,xterm-256color:extkeys"
set -g set-clipboard on
set -g allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u
set -s escape-time 0
set -g focus-events on
set -g mouse on

# Sensible defaults
set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g status-keys vi
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind p paste-buffer
set -g set-titles on
set -g set-titles-string '#h - #S:#I #W'

# Keep the familiar C-b prefix and retain C-a as a secondary prefix.
set -g prefix C-b
set -g prefix2 C-a
bind C-b send-prefix
bind C-a send-prefix -2
# Remove the old project binding, which called a helper script from its config.
unbind-key -T prefix m

# New windows and panes start in the current directory.
bind c new-window -c '#{pane_current_path}'
bind-key "-" split-window -v -c '#{pane_current_path}'
bind _ split-window -h -c '#{pane_current_path}'

# Vi-style pane navigation and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Solarized Dark Higher Contrast palette.
set -g pane-border-style 'fg=#586e75'
set -g pane-active-border-style 'fg=#2aa198'
set -g message-style 'fg=#002b36,bg=#b58900,bold'
set -g mode-style 'fg=#002b36,bg=#2aa198,bold'

# Match the palette and flat sections from the archived gpakosz/.tmux theme.
# Keep the theme self-contained: uptime comes from the system, not old plugin state.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 1000
set -g status-right-length 1000
set -g status-style 'fg=#8a8a8a,bg=#080808,none'
set -g status-left-style 'fg=#8a8a8a,bg=#080808,none'
set -g status-right-style 'fg=#8a8a8a,bg=#080808,none'

set -g status-left '#[fg=#080808,bg=#ffff00,bold] ❐ #S #[fg=#e4e4e4,bg=#ff00af,none] ↑ #(uptime | sed -E "s/^.* up +//; s/, +[0-9]+ users?.*$//; s/, +load averages?:.*$//") #[fg=#8a8a8a,bg=#080808,none] '
set -g status-right '#[fg=#8a8a8a,bg=#080808,none] #{?client_prefix,⌨,}#{?mouse,↗,}#{?session_many_attached,⚇,}#{?pane_synchronized,⚏,} | %H:%M | %d %b #[fg=#e4e4e4,bg=#d70000,none] #{user}#{?#{==:#{user},root},!,} #[fg=#080808,bg=#e4e4e4,bold] #h '

# Explicit styles also replace any theme settings retained by a running server.
setw -g window-status-separator ' '
setw -g window-status-style 'fg=#8a8a8a,bg=#080808,none'
setw -g window-status-current-style 'fg=#080808,bg=#00afff,bold'
setw -g window-status-last-style 'fg=#00afff,bg=#303030,none'
setw -g window-status-activity-style 'fg=default,bg=default,underscore'
setw -g window-status-bell-style 'fg=#ffff00,bg=default,blink,bold'
setw -g window-status-format '#I #W#{?#{||:#{window_bell_flag},#{window_zoomed_flag}}, ,}#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,}'
setw -g window-status-current-format '#I #W#{?#{||:#{window_bell_flag},#{window_zoomed_flag}}, ,}#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,}'
