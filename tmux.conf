# Standalone tmux configuration for this machine.

# Terminal and input behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:clipboard,xterm-256color:extkeys"
set -g set-clipboard on
set -g allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u
set -s escape-time 0
set -g focus-events on
set -g mouse on

# Sensible defaults
set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g status-keys vi
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind p paste-buffer
set -g set-titles on
set -g set-titles-string '#h - #S:#I #W'

# Keep the familiar C-b prefix and retain C-a as a secondary prefix.
set -g prefix C-b
set -g prefix2 C-a
bind C-b send-prefix
bind C-a send-prefix -2
# Remove the old project binding, which called a helper script from its config.
unbind-key -T prefix m

# New windows and panes start in the current directory.
bind c new-window -c '#{pane_current_path}'
bind-key "-" split-window -v -c '#{pane_current_path}'
bind _ split-window -h -c '#{pane_current_path}'

# Vi-style pane navigation and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Solarized Dark Higher Contrast palette.
set -g pane-border-style 'fg=#586e75'
set -g pane-active-border-style 'fg=#2aa198'
set -g message-style 'fg=#002b36,bg=#b58900,bold'
set -g mode-style 'fg=#002b36,bg=#2aa198,bold'

# Compact status line: session, windows, prefix state, host, and local time.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 32
set -g status-right-length 64
set -g status-style 'fg=#93a1a1,bg=#002b36'
set -g status-left '#[fg=#002b36,bg=#2aa198,bold] #S #[fg=#93a1a1,bg=#002b36] '
set -g status-right '#{?client_prefix,#[fg=#002b36,bg=#b58900,bold] PREFIX ,}#{?window_zoomed_flag,#[fg=#002b36,bg=#2aa198,bold] ZOOM ,}#[fg=#839496,bg=#002b36]#h #[fg=#586e75]| #[fg=#93a1a1,bg=#002b36]%H:%M '
setw -g window-status-format ' #[fg=#839496]#I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-current-format '#[fg=#002b36,bg=#b58900,bold] #I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-activity-style 'fg=#2aa198,bold'
setw -g window-status-bell-style 'fg=#dc322f,bold'
